<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>매장 체크</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#fff;color:#171717}
.wrap{max-width:680px;margin:auto;padding:20px 16px 115px}
.date{font-size:14px;color:#8a8a8a;margin:3px 2px 18px;font-weight:600}
.store-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 14px;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.store{flex:0 0 auto;border:1px solid #e6e6e6;background:#fff;color:#555;border-radius:14px;padding:11px 17px;font-size:15px;font-weight:700}
.store.active{background:#171717;color:#fff;border-color:#171717}
.card{background:#fff;border:1px solid #ececec;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 5px 18px rgba(0,0,0,.035)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.title{font-size:18px;font-weight:800;letter-spacing:-.4px}
.count{font-size:13px;color:#999;background:#f7f7f7;padding:6px 9px;border-radius:20px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{position:relative;aspect-ratio:1.28/1;border:1px solid #e8e8e8;border-radius:16px;overflow:hidden;background:#fafafa}
.slot input{position:absolute;inset:0;opacity:0;z-index:3;padding:0;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:none}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#777;font-size:14px;font-weight:700}
.done{position:absolute;right:8px;top:8px;background:#171717;color:#fff;border-radius:20px;padding:5px 8px;font-size:11px;display:none}
.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eee}
.actions>div{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 2fr;gap:9px}
button{border:0;border-radius:15px;padding:15px;font-size:16px;font-weight:800}
#reset{background:#f2f2f2;color:#555}
#share{background:#171717;color:#fff}
.status{text-align:center;color:#aaa;font-size:12px;margin-top:10px}
@media(min-width:560px){.photos{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">

<div class="date" id="now"></div>
<div class="store-tabs" id="storeTabs">
<button type="button" class="store active" data-store="구로">구로</button>
<button type="button" class="store" data-store="가산">가산</button>
<button type="button" class="store" data-store="여의도">여의도</button>
<button type="button" class="store" data-store="영등포">영등포</button>
<button type="button" class="store" data-store="종로">종로</button>
</div>
<div id="sections"></div>
<div class="status" id="status">사진 0 / 17</div>
</div>
<div class="actions"><div>
<button id="reset">초기화</button>
<button id="share">공유하기</button>
</div></div>
<script>
const defs=[
 ["외부 2곳",2],["음악",1],["테블릿 상태",2],["야채 상태",4],["거래명세서",4],["택배물 · 우편물",4]
];
const sections=document.getElementById("sections");
let files={};
defs.forEach(([name,n],si)=>{
 const card=document.createElement("section"); card.className="card";
 card.innerHTML=`<div class="head"><div class="title">${si+1}. ${name}</div><div class="count" id="c${si}">0 / ${n}컷</div></div><div class="photos"></div>`;
 const grid=card.querySelector(".photos");
 for(let i=0;i<n;i++){
  const slot=document.createElement("label"); slot.className="slot";
  slot.innerHTML=`<input type="file" accept="image/*" capture="environment" data-k="${si}-${i}">
  <div class="placeholder"><span>${i+1}컷 촬영</span></div><img><span class="done">✓ 완료</span>`;
  grid.appendChild(slot);
 }
 sections.appendChild(card);
});

document.getElementById("storeTabs").addEventListener("click",e=>{
 const b=e.target.closest(".store"); if(!b)return;
 document.querySelectorAll(".store").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
});

function update(){
 let total=0;
 defs.forEach((d,si)=>{
  let c=0; for(let i=0;i<d[1];i++) if(files[`${si}-${i}`]) c++;
  total+=c; document.getElementById("c"+si).textContent=`${c} / ${d[1]}컷`;
 });
 document.getElementById("status").textContent=`사진 ${total} / 17`;
}
document.addEventListener("change",e=>{
 if(!e.target.matches('input[type=file]'))return;
 const f=e.target.files[0]; if(!f)return;
 const k=e.target.dataset.k; files[k]=f;
 const slot=e.target.closest(".slot"), img=slot.querySelector("img");
 img.src=URL.createObjectURL(f); img.style.display="block";
 slot.querySelector(".placeholder").style.display="none"; slot.querySelector(".done").style.display="block"; update();
});
function stamp(){
 const d=new Date(); document.getElementById("now").textContent=d.toLocaleString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
} stamp(); setInterval(stamp,60000);
document.getElementById("reset").onclick=()=>{if(confirm("촬영한 사진과 입력 내용을 모두 지울까요?"))location.reload()};
document.getElementById("share").onclick=async()=>{
 const store=document.querySelector(".store.active").dataset.store;
 const missing=[]; defs.forEach((d,si)=>{let c=0;for(let i=0;i<d[1];i++)if(files[`${si}-${i}`])c++;if(c<d[1])missing.push(`${d[0]} ${c}/${d[1]}컷`)});
 if(missing.length && !confirm("아직 촬영하지 않은 항목이 있습니다.\n\n"+missing.join("\n")+"\n\n그래도 공유할까요?"))return;
 const date=new Date().toLocaleString("ko-KR");
 const text=`[오픈 보고]\n매장: ${store}\n시간: ${date}\n\n`+defs.map((d,si)=>{let c=0;for(let i=0;i<d[1];i++)if(files[`${si}-${i}`])c++;return `${si+1}. ${d[0]} ${c}/${d[1]}컷`;}).join("\n");
 const arr=Object.values(files);
 try{
  if(navigator.share){
   const shareData={title:"오픈 보고",text};
   if(arr.length && navigator.canShare && navigator.canShare({files:arr})) shareData.files=arr;
   await navigator.share(shareData);
  }else{
   await navigator.clipboard.writeText(text); alert("보고 내용이 복사되었습니다. 사진은 갤러리에서 함께 전송해주세요.");
  }
 }catch(e){if(e.name!=="AbortError")alert("공유가 지원되지 않는 환경입니다. 브라우저의 공유 기능을 확인해주세요.");}
};
</script>
</body></html>
