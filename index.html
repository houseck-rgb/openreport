<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>오픈 보고</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Noto Sans KR",sans-serif;background:#f5f6f8;color:#171717}
.w{max-width:680px;margin:auto;padding:16px 14px 110px}
h1{font-size:22px;margin:4px 2px 2px;letter-spacing:-.5px}
.dt{font-size:14px;color:#888;margin:2px 2px 12px;font-weight:600}
.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.cnt{font-size:13px;color:#999;background:#f3f3f3;padding:5px 9px;border-radius:20px;font-weight:700}
.cnt.ok{background:#171717;color:#fff}
.ref{display:flex;gap:10px;align-items:center;margin:10px 0}
.rimg{display:block;width:52px;height:52px;border-radius:12px;background:#f2f3f5;object-fit:cover;padding:6px}
.rimg.c{padding:0}
.ref p{margin:0;font-size:15px;color:#333;font-weight:600;line-height:1.4}
.hd u{text-decoration:none;font-size:13px;color:#aaa;font-weight:600;margin-left:4px}
.rw{position:relative;flex:0 0 52px}.rw:after{content:"🔍";position:absolute;right:-4px;bottom:-4px;font-size:11px;background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none}
.pl q{quotes:none;font-size:16px;opacity:.6;margin-bottom:2px}
.ref .en{display:block;color:#999;font-size:12px;font-weight:500}
.ref small{display:block;color:#aaa;font-size:11px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{position:relative;aspect-ratio:4/3;border:1.5px dashed #d6d6d6;border-radius:14px;overflow:hidden;background:#fafafa;display:block}
.slot.f{border:0}
.slot input{position:absolute;inset:0;opacity:0;z-index:2;width:100%}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .g{opacity:.28}
.slot .s{display:none}
.pl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#333;font-size:14px;font-weight:800;text-align:center;padding:6px;text-shadow:0 0 4px #fff,0 0 8px #fff}
.pl em{font-style:normal;font-size:11px;color:#666;font-weight:600;margin-top:2px}
.slot i{position:absolute;right:6px;top:6px;background:#171717;color:#fff;border-radius:20px;padding:3px 8px;font-size:11px;font-style:normal;display:none}
.slot.f .s,.slot.f i{display:block}.slot.f .pl,.slot.f .g{display:none}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eee}
.bar div{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}
button{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
#rs{background:#f0f0f0;color:#555}#sh{background:#171717;color:#fff}
#st{text-align:center;color:#999;font-size:13px;margin-top:8px}
#vw{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;overflow-y:auto;padding:20px 16px 40px;z-index:9;text-align:center}
#vw b{display:block;color:#fff;font-size:17px;margin:4px 0}
#vw p{color:#ccc;font-size:14px;margin:0 0 14px}
#vw figure{margin:0 auto 16px;max-width:520px}
#vw img{width:100%;border-radius:12px;background:#fff}
#vw figcaption{color:#fff;font-size:14px;font-weight:700;margin-top:6px}
#vw .x{color:#aaa;font-size:13px}
@media(min-width:560px){.ph{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="w">

<div class="dt" id="dt"></div>
<div id="L"></div>
<div id="st"></div>
</div>
<div class="bar"><div><button id="rs">초기화</button><button id="sh">공유하기</button></div></div>
<div id="vw"></div>
